<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TeacherGPT{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="dashboard-header">
        <h1><i class="fas fa-chalkboard-teacher"></i> TeacherGPT</h1>
        <nav>
            <a href="/"><i class="fas fa-home"></i> Home</a>
            <a href="/general_question"><i class="fas fa-question-circle"></i> Ask</a>
            <a href="/upload"><i class="fas fa-upload"></i> Upload</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="dashboard-footer">
        <p>© 2025 TeacherGPT - AI Teaching Assistant</p>
    </footer>
</body>
</html>
